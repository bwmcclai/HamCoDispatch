<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamilton County Dispatch — Live Fire, Police & EMS Activity</title>
    <meta name="description"
        content="Real-time fire, police, and EMS activity map for Hamilton County, Indiana. A fresh, modern way for citizens to monitor live emergency services.">
    <meta name="keywords"
        content="Hamilton County, Noblesville, Carmel, Fishers, Westfield, Indiana, fire, police, EMS, emergency, live, map, scanner, siren">
    <meta name="theme-color" content="#0a0a0f">

    <!-- Open Graph -->
    <meta property="og:title" content="Hamilton County Dispatch — Live Emergency Activity">
    <meta property="og:description"
        content="A fresh, modern way for Hamilton County, IN citizens to monitor live emergency services.">
    <meta property="og:type" content="website">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet.heat Plugin -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Ambient Background Glow -->
    <div class="ambient-glow" id="ambientGlow"></div>

    <!-- Top Navigation Bar -->
    <header class="top-bar" id="topBar">
        <div class="top-bar-left">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="16" cy="16" r="14" stroke="url(#logoGrad)" stroke-width="2" fill="none" />
                        <circle cx="16" cy="16" r="6" fill="url(#logoGrad)" opacity="0.8" />
                        <circle cx="16" cy="16" r="10" stroke="url(#logoGrad)" stroke-width="1" stroke-dasharray="3 3"
                            opacity="0.5">
                            <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16"
                                dur="20s" repeatCount="indefinite" />
                        </circle>
                        <defs>
                            <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32">
                                <stop offset="0%" stop-color="#ff6b35" />
                                <stop offset="50%" stop-color="#f72585" />
                                <stop offset="100%" stop-color="#7209b7" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>HamCo<span class="logo-accent">Dispatch</span></h1>
                    <p class="logo-subtitle">HAMILTON COUNTY EMERGENCY SERVICES</p>
                </div>
            </div>
        </div>
        <div class="top-bar-center">
            <div class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span class="status-text">LIVE</span>
            </div>
        </div>
        <div class="top-bar-right">
            <div class="time-filter-wrapper">
                <button id="liveModeBtn" class="time-btn active" title="Live Events">LIVE</button>
                <button id="historyModeBtn" class="time-btn" title="Historical Events">HISTORY</button>
                <input type="date" id="historyDate" class="history-date-input" style="display:none;" />
            </div>
            <select id="cityFilter" class="city-select" title="Filter by City">
                <option value="all">All Hamilton County</option>
                <option value="Noblesville">Noblesville</option>
                <option value="Carmel">Carmel</option>
                <option value="Fishers">Fishers</option>
                <option value="Westfield">Westfield</option>
                <option value="Cicero">Cicero</option>
                <option value="Sheridan">Sheridan</option>
                <option value="Arcadia">Arcadia</option>
                <option value="Atlanta">Atlanta</option>
                <option value="County">County / Unincorp.</option>
            </select>
            <div class="divider-v"></div>
            <div class="clock" id="clock"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Map Container -->
        <div class="map-wrapper" id="mapWrapper">
            <div id="map"></div>
            <!-- Map Overlay Controls -->
            <div class="map-controls">
                <button class="map-control-btn" id="zoomInBtn" aria-label="Zoom in">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button class="map-control-btn" id="zoomOutBtn" aria-label="Zoom out">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <div class="map-control-divider"></div>
                <button class="map-control-btn" id="recenterBtn" aria-label="Re-center map">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
                    </svg>
                </button>
                <div class="map-control-divider"></div>
                <button class="map-control-btn" id="stationsToggleBtn" aria-label="Toggle fire stations"
                    title="Show/hide fire stations">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"></path>
                    </svg>
                </button>
                <div class="map-control-divider"></div>
                <button class="map-control-btn" id="heatmapToggleBtn" aria-label="Toggle Heatmap"
                    title="Show/hide Heatmap" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" fill="currentColor" />
                        <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-dasharray="2 2" fill="none" />
                    </svg>
                </button>
            </div>

            <!-- Audio Panel -->
            <div class="audio-panel" id="audioPanel">
                <div class="audio-panel-header" id="audioPanelToggle">
                    <div class="audio-panel-title">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                        </svg>
                        <span>Scanner Audio</span>
                    </div>
                    <svg class="audio-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <div class="audio-panel-body" id="audioPanelBody">
                    <div class="audio-feed-list">
                        <div class="audio-feed-embed"
                            style="width:100%; height:50px; overflow:hidden; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                            <iframe src="https://www.broadcastify.com/webPlayer/3332" frameborder="0"
                                style="width: 100%; height: 50px;" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="audio-note">Provided by Broadcastify embedded player</p>
                </div>
            </div>

            <!-- Map Legend -->
            <div class="map-legend">
                <div class="legend-item">
                    <span class="legend-dot legend-fire"></span>
                    <span>Fire</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot legend-police"></span>
                    <span>Police</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot legend-ems"></span>
                    <span>EMS</span>
                </div>
            </div>
            <!-- Floating Filters -->
            <div class="map-filters" id="mapFilters">
                <button class="stat-card filter-tab active" data-filter="all" id="filterAll">
                    <div class="stat-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-activity">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M3 12h4l3 -9l5 18l3 -9h6" />
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="allCount">0</span>
                        <span class="stat-label">All</span>
                    </div>
                </button>
                <div class="filter-divider"></div>
                <button class="stat-card filter-tab stat-fire" data-filter="fire" id="filterFire">
                    <div class="stat-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-flame">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path
                                d="M12 12c2 -2.96 0 -7 -1 -8c0 3.038 -1.773 4.741 -3 6c-1.226 1.26 -2 3.24 -2 5a6 6 0 1 0 12 0c0 -1.532 -1.056 -3.94 -2 -5c-1.786 3 -2.791 3 -4 2z" />
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="fireCount">0</span>
                        <span class="stat-label">Fire</span>
                    </div>
                </button>
                <button class="stat-card filter-tab stat-police" data-filter="police" id="filterPolice">
                    <div class="stat-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-shield-half">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path
                                d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3" />
                            <path d="M12 3v18" />
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="policeCount">0</span>
                        <span class="stat-label">Police</span>
                    </div>
                </button>
                <button class="stat-card filter-tab stat-ems" data-filter="ems" id="filterEms">
                    <div class="stat-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-ambulance">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                            <path d="M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                            <path d="M5 17h-2v-11a1 1 0 0 1 1 -1h9v12m-4 0h6m4 0h2v-6h-8m0 -5h5l3 5" />
                            <path d="M6 10h4m-2 -2v4" />
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="emsCount">0</span>
                        <span class="stat-label">EMS</span>
                    </div>
                </button>
            </div>

            <!-- Bottom Marquee -->
            <div class="marquee-wrapper">
                <div class="marquee-track" id="incidentMarquee">
                    <!-- Incidents dynamically populated -->
                </div>
            </div>
        </div>
    </main>

    <!-- Incident Detail Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="incidentModal">
            <button class="modal-close" id="modalClose" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-header">
                <div class="modal-badge" id="modalBadge">FIRE</div>
                <h2 class="modal-title" id="modalTitle">Structure Fire</h2>
                <p class="modal-time" id="modalTime">2 minutes ago</p>
            </div>
            <div class="modal-body">
                <div class="modal-detail">
                    <span class="modal-detail-label">Location</span>
                    <span class="modal-detail-value" id="modalLocation">—</span>
                </div>
                <div class="modal-detail">
                    <span class="modal-detail-label">Agency</span>
                    <span class="modal-detail-value" id="modalUnits">—</span>
                </div>
                <div class="modal-detail">
                    <span class="modal-detail-label">Incident #</span>
                    <span class="modal-detail-value" id="modalStatus">—</span>
                </div>
                <div class="modal-detail">
                    <span class="modal-detail-label">Reported</span>
                    <span class="modal-detail-value" id="modalReported">--</span>
                </div>
            </div>
            <div class="modal-map-preview" id="modalMapPreview"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>

</html>
